name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: Unpack project zip if needed
        run: |
          if [ -z "$(find . -name build.gradle -not -path './.git/*' | head -n1)" ]; then
            Z=$(ls *.zip 2>/dev/null | head -n1)
            if [ -z "$Z" ]; then
              echo "Нет ни build.gradle, ни .zip с проектом в репозитории"
              ls -la
              exit 1
            fi
            echo "Распаковываю $Z"
            unzip -q "$Z" -d project
          fi

      - name: Build
        run: |
          BG=$(find . -name build.gradle -not -path './.git/*' | head -n1)
          cd "$(dirname "$BG")"
          sed -i '/^org.gradle.java.home=/d' gradle.properties || true
          gradle clean build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathClient-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
