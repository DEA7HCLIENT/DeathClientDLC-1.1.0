name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: Show repo files
        run: ls -la && find . -maxdepth 2 -not -path './.git*' | head -50

      - name: Build
        run: |
          BG=$(find . -name build.gradle -not -path './.git/*' | head -n1)
          if [ -z "$BG" ]; then
            echo "build.gradle не найден в репозитории"; exit 1
          fi
          cd "$(dirname "$BG")"
          gradle clean build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathClient-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
