name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          GRADLEW=$(find . -name gradlew -not -path './.git/*' | head -n1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew не найден в репозитории"; exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathClient-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
